name: Verify Rust color engine and TypeScript rollback

on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/post-rust-cleanup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Checkout pinned Rust source
        uses: actions/checkout@v4
        with:
          repository: pfxamd/pfx-color-core
          ref: 28aff99941787ee30f52742c36110bc4e03a8b7c
          path: .pfx-rust-core
          persist-credentials: false
      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production WebAssembly from pinned Rust
        run: |
          cargo build --manifest-path .pfx-rust-core/Cargo.toml -p pfx-color-ffi --target wasm32-unknown-unknown --release
          mkdir -p public/rust
          cp .pfx-rust-core/target/wasm32-unknown-unknown/release/pfx_color_ffi.wasm public/rust/
          cp .pfx-rust-core/bindings/javascript/pfx-color-core.mjs public/rust/
          cp .pfx-rust-core/bindings/javascript/pfx-color-tools.mjs public/rust/
          cp .pfx-rust-core/bindings/javascript/pfx-color-workspace.mjs public/rust/
          test -s public/rust/pfx_color_ffi.wasm
      - name: Install app packages
        run: npm install --no-audit --no-fund
      - name: Run all unit tests and production-path build
        env:
          PFX_BASE_PATH: /pfx-colors/
        run: npm run check
      - name: Confirm cleaned engine layout and deployed assets
        run: |
          test -f src/rust/operations.ts
          test -f src/rust/loader.ts
          test -f src/rust/gradient-worker.ts
          test ! -d src/rust-experiment
          test -s dist/rust/pfx_color_ffi.wasm
          grep -Fq '/pfx-colors/assets/' dist/index.html
      - name: Install browser runners
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium firefox
      - name: Serve final production build locally
        env:
          PFX_BASE_PATH: /pfx-colors/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pfx-cleanup-verification.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/pfx-colors/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/pfx-colors/rust/pfx_color_ffi.wasm -o /tmp/pfx-cleanup.wasm
          test "$(wc -c < /tmp/pfx-cleanup.wasm)" -gt 10000
      - name: Check Rust default and legacy fallback under real browser failures
        run: node scripts/rust-production.browser.mjs
        env:
          PFX_COLORS_URL: http://127.0.0.1:4173/pfx-colors/
      - name: Check Rust and TypeScript color parity
        run: node scripts/rust-integration.browser.mjs
        env:
          PFX_COLORS_URL: http://127.0.0.1:4173/pfx-colors/
      - name: Check gradient drag responsiveness
        run: node scripts/rust-drag-perf.browser.mjs
        env:
          PFX_COLORS_URL: http://127.0.0.1:4173/pfx-colors/
      - name: Verify redesigned workspace, themes, Explore, Tones and Collections
        run: node scripts/workspace-v2.browser.mjs
        env:
          PFX_COLORS_URL: http://127.0.0.1:4173/pfx-colors/
      - name: Audit all responsive light and dark tool layouts
        run: node scripts/visual-qa.browser.mjs
        env:
          PFX_COLORS_URL: http://127.0.0.1:4173/pfx-colors/
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-color-engine-regression
          path: browser-evidence/
          if-no-files-found: ignore
