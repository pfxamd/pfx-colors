name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout pinned Rust core for the production engine
        uses: actions/checkout@v4
        with:
          repository: pfxamd/pfx-color-core
          ref: 28aff99941787ee30f52742c36110bc4e03a8b7c
          path: rust-production-source
          persist-credentials: false

      - name: Set up production Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile the first-party Rust engine for GitHub Pages
        run: |
          cargo build --manifest-path rust-production-source/Cargo.toml -p pfx-color-ffi --target wasm32-unknown-unknown --release
          mkdir -p public/rust
          cp rust-production-source/target/wasm32-unknown-unknown/release/pfx_color_ffi.wasm public/rust/
          cp rust-production-source/bindings/javascript/pfx-color-core.mjs public/rust/
          cp rust-production-source/bindings/javascript/pfx-color-tools.mjs public/rust/
          cp rust-production-source/bindings/javascript/pfx-color-workspace.mjs public/rust/
          test -s public/rust/pfx_color_ffi.wasm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          PFX_BASE_PATH: /${{ github.event.repository.name }}/

      # Snapshot production output before adding the independently pinned /preview/ subtree.
      - name: Snapshot existing public files
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/pfx-original.sha256"

      - name: Checkout validated Rust preview source
        uses: actions/checkout@v4
        with:
          repository: pfxamd/pfx-colors
          ref: 26f1081f5f863f37c9855be7839664ca3cdfb354
          path: preview-source
          persist-credentials: false

      # Both sites use exactly the same pinned Rust source. Reuse the
      # verified production WASM/bindings instead of recompiling them.
      - name: Reuse the pinned Rust engine for the isolated preview
        run: |
          mkdir -p preview-source/public/rust
          cp public/rust/pfx_color_ffi.wasm preview-source/public/rust/
          cp public/rust/pfx-color-core.mjs preview-source/public/rust/
          cp public/rust/pfx-color-tools.mjs preview-source/public/rust/
          cp public/rust/pfx-color-workspace.mjs preview-source/public/rust/
          cmp public/rust/pfx_color_ffi.wasm preview-source/public/rust/pfx_color_ffi.wasm

      - name: Install, test, and build the isolated preview
        working-directory: preview-source
        env:
          PFX_BASE_PATH: /pfx-colors/preview/
        run: |
          npm install --no-audit --no-fund
          npm run check
          node scripts/prepare-rust-staging.mjs
          mkdir -p ../dist/preview
          cp -a staging-dist/. ../dist/preview/

      - name: Verify production payload unchanged by isolated preview build
        run: |
          sha256sum --check --status "$RUNNER_TEMP/pfx-original.sha256"
          test -s dist/preview/rust/pfx_color_ffi.wasm
          test -s dist/preview/rust/pfx-color-core.mjs
          test -s dist/preview/preview-info/build.json
          grep -Fq '/pfx-colors/assets/' dist/index.html
          grep -Fq '/pfx-colors/preview/assets/' dist/preview/index.html
          grep -Fq '__PFX_RUST_STAGING__ = true' dist/preview/index.html
          grep -Fq 'noindex' dist/preview/index.html
          grep -Fq '"hostingBase": "/pfx-colors/preview/"' dist/preview/preview-info/build.json
          test -s dist/rust/pfx_color_ffi.wasm
          test -s dist/rust/pfx-color-core.mjs
          test -s dist/rust/pfx-color-workspace.mjs

      - name: Test combined GitHub Pages site in Chromium and Firefox
        run: |
          mkdir -p "$RUNNER_TEMP/pfx-pages-root/pfx-colors"
          cp -a dist/. "$RUNNER_TEMP/pfx-pages-root/pfx-colors/"
          python3 -m http.server 4177 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pfx-pages-root" > /tmp/pfx-pages-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4177/pfx-colors/preview/ > /dev/null; then break; fi
            sleep 1
          done
          cd preview-source
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium firefox
          PFX_STAGING_URL=http://127.0.0.1:4177/pfx-colors/preview/ node scripts/rust-staging.browser.mjs

      - name: Preserve preview browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-pages-preview-validation
          path: preview-source/browser-evidence/rust-staging/
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm real production Rust core was published
        run: |
          BASE="https://pfxamd.github.io/pfx-colors/"
          for i in $(seq 1 36); do
            if curl --fail --silent --location "${BASE}" -o /tmp/pfx-live-root.html 2>/dev/null \
              && curl --fail --silent --location "${BASE}rust/pfx_color_ffi.wasm" -o /tmp/pfx-live-prod.wasm 2>/dev/null \
              && test "$(wc -c < /tmp/pfx-live-prod.wasm)" -gt 10000 \
              && grep -Fq '/pfx-colors/assets/' /tmp/pfx-live-root.html; then
              echo "Production Rust assets available: ${BASE}"
              exit 0
            fi
            sleep 5
          done
          echo "Production Rust engine assets not verified"
          exit 1

      - name: Verify the public preview path after Pages deployment
        run: |
          URL="https://pfxamd.github.io/pfx-colors/preview/"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location "$URL" -o /tmp/pfx-preview-live.html 2>/dev/null \
              && grep -Fq '__PFX_RUST_STAGING__ = true' /tmp/pfx-preview-live.html \
              && curl --fail --silent --show-error --location "${URL}rust/pfx_color_ffi.wasm" -o /tmp/pfx-preview-live.wasm 2>/dev/null \
              && test "$(wc -c < /tmp/pfx-preview-live.wasm)" -gt 10000; then
              echo "LIVE GitHub Pages Rust preview assets confirmed: $URL"
              cd preview-source
              PFX_STAGING_URL="$URL" node scripts/rust-staging.browser.mjs
              echo "LIVE GitHub Pages Rust preview browser review confirmed: $URL"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages preview was not independently confirmed"
          exit 1
